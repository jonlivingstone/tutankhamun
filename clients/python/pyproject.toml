[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tutankhamun"
version = "0.1.0"
description = "Native Python client for the Tutankhamun analytics engine (Arrow FlightSQL)."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Tutankhamun contributors" }]
keywords = ["arrow", "flightsql", "analytics", "tutankhamun"]
dependencies = ["pyarrow>=14"]

[project.optional-dependencies]
pandas = ["pandas>=1.5"]
polars = ["polars>=0.20"]
dev = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/jonlivingstone/tutankhamun"

[tool.hatch.build.targets.wheel]
packages = ["src/tutankhamun"]

[tool.pytest.ini_options]
testpaths = ["tests"]
